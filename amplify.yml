version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies from monorepo root..."
        - cd $CODEBUILD_SRC_DIR/web-ecommerce
        - npm ci
    build:
      commands:
        - cd $CODEBUILD_SRC_DIR/web-ecommerce
        - echo "=== ENVIRONMENT VARIABLES DEBUG ==="
        - echo "NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL"
        - echo "ID=$ID"
        - echo "APP_NAME=$APP_NAME"
        - echo "===================================="
        - cd apps/web-nami
        - npm run build
  artifacts:
    baseDirectory: apps/web-nami/.next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/web-nami/.next/cache/**/*
